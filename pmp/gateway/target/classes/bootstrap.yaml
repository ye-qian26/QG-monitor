spring:
  main:
    # 强制使用响应式 Web 类型（WebFlux），禁用 Servlet 类型（MVC）
    web-application-type: reactive
  application:
    name: gateway
  cloud:
    gateway:
      # 禁用GRPC相关的过滤器和自动配置
      enabled: true
      # 关键配置：排除GRPC相关的过滤器工厂
      filter:
        json-to-grpc:
          enabled: false  # 关闭JSON转GRPC的过滤器
      # （可选）若仍有问题，添加以下配置排除所有GRPC相关自动配置
      auto-configure:
        exclude:
          - org.springframework.cloud.gateway.config.GrpcSslConfigurer
          - org.springframework.cloud.gateway.filter.GrpcMetricsPostProcessor
    nacos:
      server-addr: 192.168.148.100:8848
      username: nacos
      password: nacos
      config:
        enabled: true  # 配置中心启用
        file-extension: yaml
        shared-configs:
          - data-id: shared-jdbc.yaml
          - data-id: shared-log.yaml
          - data-id: shared-swagger.yaml
          - data-id: gateway-routes.json
          - data-id: shared-seata.yaml
        discovery:
          ip: 192.168.148.1